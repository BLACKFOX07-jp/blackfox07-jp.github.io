<style>
body {
    background: linear-gradient(180deg, #050505, #111827);
    color: white;
    font-family: 'Segoe UI', sans-serif;
    margin: 0;
    overflow-x: hidden;
}

header {
    text-align: center;
    padding: 40px 20px;
}

h1 {
    font-size: clamp(2rem, 8vw, 4rem);
    background: linear-gradient(90deg,#fff,#00ffe5);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin: 0;
}

.subtitle {
    color: #aaa;
    letter-spacing: 4px;
    margin-top: 10px;
}

.game-container {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(300px,1fr));
    gap: 25px;
    padding: 20px;
    max-width: 1200px;
    margin: auto;
}

.game-card {
    position: relative;
    height: 300px;
    border-radius: 24px;
    overflow: hidden;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    transition: 0.4s;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 25px;
    box-sizing: border-box;
}

.game-card:hover {
    transform: translateY(-8px) scale(1.02);
}

.card-bg {
    position: absolute;
    inset: 0;
    z-index: 0;
    opacity: 0.85;
}

.game-title,
.play-button {
    position: relative;
    z-index: 2;
}

.game-title {
    font-size: 1.8rem;
    font-weight: 900;
    margin-bottom: 20px;
    text-shadow: 0 0 15px rgba(0,0,0,0.9);
}

.play-button {
    text-decoration: none;
    border: 2px solid white;
    padding: 12px;
    border-radius: 50px;
    text-align: center;
    color: white;
    font-weight: bold;
    transition: 0.3s;
    background: rgba(0,0,0,0.4);
}

.play-button:hover {
    background: white;
    color: black;
}

/* 通常背景 */
.bg-slot777 {
    background:
    radial-gradient(circle at 20% 20%, rgba(255,0,100,0.8), transparent 30%),
    radial-gradient(circle at 80% 30%, rgba(255,200,0,0.8), transparent 30%),
    linear-gradient(135deg,#240046,#5a189a,#9d4edd);
}

.bg-neon {
    background:
    linear-gradient(45deg,#000428,#004e92),
    repeating-linear-gradient(90deg,transparent 0 20px,rgba(0,255,255,0.2) 20px 22px);
}

.bg-block {
    background:
    repeating-linear-gradient(45deg,#00ff99 0 20px,#0f172a 20px 40px);
}

/* ===== 2DRUN 自動生成風背景 ===== */
.bg-run {
    background:
    linear-gradient(to bottom,#4fc3f7 0%,#81d4fa 40%,#dcedc8 40%,#8bc34a 100%);
}

.bg-run::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
    repeating-linear-gradient(
        90deg,
        rgba(255,255,255,0.08) 0 6px,
        transparent 6px 12px
    );
    opacity: 0.4;
}

.bg-run::after {
    content: "";
    position: absolute;
    bottom: 20px;
    left: -20%;
    width: 140%;
    height: 120px;
    background:
    radial-gradient(circle,#1b5e20 20%,transparent 21%) 0 0/80px 80px,
    radial-gradient(circle,#2e7d32 20%,transparent 21%) 40px 20px/80px 80px;
    opacity: 0.9;
}

.card-run:hover {
    box-shadow: 0 0 25px #90caf9;
}

/* ===== ピン太郎 自動生成風背景 ===== */
.bg-pintarou {
    background:
    linear-gradient(to bottom,#111827,#1f2937 40%,#6d4c41 40%,#8d6e63 100%);
}

.bg-pintarou::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
    repeating-linear-gradient(
        90deg,
        rgba(255,255,255,0.07) 0 4px,
        transparent 4px 8px
    );
    opacity: 0.35;
}

.bg-pintarou::after {
    content: "🎳";
    position: absolute;
    font-size: 120px;
    right: 20px;
    bottom: 10px;
    opacity: 0.25;
    transform: rotate(-15deg);
}

.card-pintarou:hover {
    box-shadow: 0 0 30px #ff1744;
}

.bg-blackjack {
    background:
    linear-gradient(135deg,#001f1f,#004d40,#1b5e20);
}

footer {
    text-align: center;
    padding: 40px;
    color: #666;
}

@media(max-width:600px){
    .game-card {
        height: 250px;
    }
}
</style>
