<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLACKFOX07GAMES</title>
    <style>
        /* 全体の背景デザイン */
        body {
            background-color: #0a0a0c;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* ヘッダー部分 */
        header {
            text-align: center;
            padding: 60px 20px;
        }

        h1 {
            font-size: 3.5rem;
            margin: 0;
            letter-spacing: 4px;
            background: linear-gradient(to right, #fff, #00ffcc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 10px rgba(0,255,204,0.5));
        }

        .subtitle {
            font-size: 1.2rem;
            color: #aaa;
            margin-top: 15px;
            letter-spacing: 8px;
            text-transform: uppercase;
        }

        /* ゲーム一覧のコンテナ */
        .game-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 40px;
            padding: 20px;
            max-width: 1100px;
        }

        /* ゲームカードの共通デザイン */
        .game-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            width: 320px;
            padding: 40px 20px;
            text-align: center;
            transition: all 0.4s ease;
            backdrop-filter: blur(5px);
            position: relative;
            overflow: hidden;
        }

        /* ホバー時の挙動 */
        .game-card:hover {
            transform: translateY(-15px);
            background: rgba(255, 255, 255, 0.08);
        }

        .game-title {
            font-size: 1.8rem;
            margin-bottom: 30px;
            font-weight: 800;
            font-style: italic;
        }

        /* 再生ボタンのデザイン */
        .play-button {
            display: inline-block;
            text-decoration: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.2rem;
            transition: all 0.3s ease;
            border: 2px solid;
        }

        /* SLOT777 個別の色設定（情熱の赤系） */
        .card-slot777:hover { border-color: #ff3366; box-shadow: 0 0 30px rgba(255, 51, 102, 0.3); }
        .btn-slot777 { color: #ff3366; border-color: #ff3366; }
        .btn-slot777:hover { background: #ff3366; color: #fff; box-shadow: 0 0 20px #ff3366; }

        /* NEON SLOT2000 個別の色設定（サイバーな青・緑系） */
        .card-neon:hover { border-color: #00d4ff; box-shadow: 0 0 30px rgba(0, 212, 255, 0.3); }
        .btn-neon { color: #00d4ff; border-color: #00d4ff; }
        .btn-neon:hover { background: #00d4ff; color: #fff; box-shadow: 0 0 20px #00d4ff; }

        footer {
            margin-top: auto;
            padding: 50px;
            color: #444;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>BLACKFOX07GAMES</h1>
        <div class="subtitle">ブラウザゲーム</div>
    </header>

    <main class="game-container">
        
        <!-- SLOT777 の枠 -->
        <div class="game-card card-slot777">
            <div class="game-title">SLOT777</div>
            <a href="https://blackfox07-jp.github.io/slot777/" class="play-button btn-slot777" target="_blank">▶ 再生</a>
        </div>

        <!-- NEON SLOT2000 の枠 -->
        <div class="game-card card-neon">
            <div class="game-title">NEON SLOT2000</div>
            <a href="https://blackfox07-jp.github.io/neonslot2000/" class="play-button btn-neon" target="_blank">▶ 再生</a>
        </div>

    </main>

    <footer>
        &copy; 2026 BLACKFOX07GAMES. All Rights Reserved.
    </footer>

</body>
</html>
