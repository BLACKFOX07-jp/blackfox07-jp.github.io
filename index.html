<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BLACKFOX07GAMES</title>
    <style>
        body {
            background-color: #050505;
            background-image: radial-gradient(circle at center, #1a001a 0%, #000000 100%);
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        
        /* ヘッダーエリアの調整 */
        header {
            text-align: center;
            margin: 30px 0 40px 0;
        }
        h1 {
            font-size: 2.2em;
            text-shadow: 0 0 10px #fff, 0 0 20px #f0f, 0 0 30px #f0f;
            margin: 0;
            letter-spacing: 2px;
        }
        .subtitle {
            font-size: 1em;
            color: #0ff;
            text-shadow: 0 0 5px #0ff;
            margin-top: 5px;
            font-weight: bold;
            letter-spacing: 5px;
        }
        
        @media (min-width: 768px) {
            h1 { font-size: 3.5em; }
            .subtitle { font-size: 1.2em; }
            header { margin: 50px 0 60px 0; }
        }

        .game-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            max-width: 1000px;
            width: 100%;
        }
        @media (min-width: 768px) {
            .game-grid { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }
        }

        .game-card {
            background: rgba(20, 20, 20, 0.8);
            border: 2px solid #f0f;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }
        .game-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 30px #f0f;
        }

        .game-title {
            font-size: 1.3em;
            margin-bottom: 25px;
            color: #0ff;
            text-shadow: 0 0 5px #0ff;
        }

        .play-button {
            background: transparent;
            border: 2px solid #0ff;
            color: #0ff;
            padding: 15px 0;
            width: 85%;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            -webkit-tap-highlight-color: transparent;
        }
        @media (min-width: 768px) {
            .play-button { padding: 15px 40px; width: auto; }
        }

        .play-button:active {
            background: rgba(0, 255, 255, 0.2);
        }
        .play-button:hover {
            background: #0ff;
            color: #000;
            box-shadow: 0 0 20px #0ff;
        }
        .play-button::before {
            content: '▶';
        }

        footer {
            margin-top: auto;
            padding: 40px 20px;
            color: #444;
            font-size: 0.8em;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>BLACKFOX07GAMES</h1>
        <div class="subtitle">ブラウザゲーム</div>
    </header>

    <div class="game-grid">
        <!-- Game 1 -->
        <div class="game-card">
            <div class="game-title">NEON SLOT 2000</div>
            <a href="カジノスロット.html" class="play-button">PLAY NOW</a>
        </div>

        <!-- Game 2 -->
        <div class="game-card">
            <div class="game-title">SLOT777 ver.0.3</div>
            <a href="SLOT777ver.03.html" class="play-button">PLAY NOW</a>
        </div>
    </div>

    <footer>
        &copy; 2024 BLACKFOX07GAMES - Browser Game Collection
    </footer>

</body>
</html>
